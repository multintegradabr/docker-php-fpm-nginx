name: Build e publicação da imagem

on:
  push:
    branches: [php8.2-nodejs-ubuntu]
  pull_request:
  # Rebuild semanal: pega os patches de segurança do PHP (ppa:ondrej) e do Ubuntu.
  # O APT_REFRESH do dia invalida a camada do apt; o smoke test confere a versão instalada.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/multintegradabr/php-fpm-nginx
  PHP_VERSION: "8.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [ci, app]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Data do refresh do apt
        id: refresh
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          build-args: APT_REFRESH=${{ steps.refresh.outputs.date }}
          tags: local/php:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint php local/php:${{ matrix.target }} -v
          missing=""
          for ext in bcmath curl gd intl mbstring "Zend OPcache" pdo_pgsql pgsql redis sqlite3 xml zip; do
            docker run --rm --entrypoint php local/php:${{ matrix.target }} -m | grep -qix "$ext" || missing="$missing $ext"
          done
          if [ -n "$missing" ]; then echo "Extensões faltando:$missing"; exit 1; fi
          docker run --rm --entrypoint composer local/php:${{ matrix.target }} --version
          # O cadastro do PPA é etapa de build: não manter seu stack Python/Polkit no runtime.
          docker run --rm --entrypoint sh local/php:${{ matrix.target }} -ec '
            for package in software-properties-common python3-jwt python3-cryptography; do
              if dpkg-query -W -f "\${db:Status-Status}\n" "$package" 2>/dev/null | grep -qx installed; then
                echo "Pacote de bootstrap ainda instalado: $package"; exit 1
              fi
            done
          '
          # Falha se o ppa:ondrej já tem um PHP mais novo do que o instalado na imagem.
          if ! docker run --rm --user root -e V="${PHP_VERSION}" --entrypoint sh local/php:${{ matrix.target }} -ec '
            apt-get update -qq
            inst=$(dpkg-query -W -f "\${Version}" "php$V-cli")
            cand=$(apt-cache policy "php$V-cli" | sed -n "s/ *Candidate: //p")
            echo "php$V-cli: instalado $inst, disponível $cand"
            test "$inst" = "$cand"
          '; then
            msg="A imagem não está com o PHP mais recente do ppa:ondrej"
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$msg"; exit 1
            fi
            echo "::warning::$msg (o primeiro build do dia refaz a camada do apt)"
          fi
          if [ "${{ matrix.target }}" = "ci" ]; then
            # Mesmos programas usados pelo actions/cache; também valida UID sem entrada no passwd.
            docker run --rm --user 1001 --entrypoint sh local/php:ci -ec '
              archive_dir=$(mktemp -d)
              cd "$archive_dir"
              mkdir source restored
              printf "cache fixture\n" > "source/file with spaces"
              ln -s "file with spaces" source/link
              tar --posix -cf cache.tar.zst --use-compress-program zstdmt source
              tar -xf cache.tar.zst --use-compress-program unzstd -C restored
              cmp "source/file with spaces" "restored/source/file with spaces"
              test "$(readlink restored/source/link)" = "file with spaces"
            '
          fi
          if [ "${{ matrix.target }}" = "app" ]; then
            # O php-fpm sobe como multi pelo supervisor; como root ele exige "user" no pool.
            docker run --rm --entrypoint php-fpm${PHP_VERSION} local/php:app -t --fpm-config /etc/php/${PHP_VERSION}/fpm/php-fpm.conf
            docker run --rm --user root --entrypoint nginx local/php:app -t
            docker run --rm --entrypoint node local/php:app -v
            docker run --rm --entrypoint supervisord local/php:app --version
          fi

      - name: Tags
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          base="${IMAGE}:${PHP_VERSION}-${{ matrix.target }}"
          echo "list=${base},${base}-$(date -u +%Y%m%d),${base}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicação
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: APT_REFRESH=${{ steps.refresh.outputs.date }}
          # Sem attestation: ela cria manifests filhos que a retenção conta como versões e apaga,
          # deixando tags antigas quebradas.
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.target }}

  # O pacote é privado e conta no armazenamento do plano: sem retenção, os rebuilds semanais
  # acumulam versões para sempre.
  retention:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: php-fpm-nginx
          package-type: container
          # 2 versões por build (ci + app): ~15 builds, uns 3 meses de rebuild semanal.
          min-versions-to-keep: 30
